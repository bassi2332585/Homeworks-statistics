<script type="module">
    import {
      HDNodeWallet, Mnemonic, SigningKey, keccak256, getBytes, getAddress
    } from "https://cdn.jsdelivr.net/npm/ethers@6.13.5/+esm";

    const ETH_PATH = "m/44'/60'/0'/0/0";
    const SECP_N = BigInt("0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141");

    function formatStep(title, meta, value, desc, extraClass = "") {
      return `<div class="step-box ${extraClass}">
        <div class="step-header"><span class="step-title">${title}</span><span class="step-meta">${meta}</span></div>
        <div class="step-val">${value}</div><div class="step-desc">${desc}</div>
      </div>`;
    }

    function getWalletFromPhrase(phrase) {
      const normalized = phrase.trim().replace(/\s+/g, " ").toLowerCase();
      const mnemonic = Mnemonic.fromPhrase(normalized);
      const seed = mnemonic.computeSeed();
      const wallet = HDNodeWallet.fromPhrase(normalized, "", ETH_PATH);
      return { normalized, mnemonic, seed, wallet };
    }

    function renderPipelineUI(data) {
      const container = document.getElementById("pipelineContainer");
      container.innerHTML = [
        formatStep("1. Mnemonic Sentence (BIP-39)", "12/24 parole", data.phrase,
          "Frase mnemonica fornita come input. Le parole appartengono al dizionario BIP-39 e superano il checksum."),
        formatStep("2. Binary Seed (BIP-39 via PBKDF2)", "512 bit / 64 byte", "0x" + data.seed,
          "Seed calcolato dalla mnemonic tramite PBKDF2-HMAC-SHA512 con 2048 iterazioni e salt 'mnemonic' (passphrase vuota in questo esempio)."),
        formatStep("3. BIP-32 Master Extended Key", "HMAC-SHA512", 
          `<strong>Master private key:</strong> 0x${data.masterPrivateKey}<br><strong>Master chain code:</strong> 0x${data.chainCode}`,
          "Valori master ricavati con la derivazione HD standard. La master private key e il chain code sono distinti.", "bip32"),
        formatStep("4. BIP-44 Derivation Path", ETH_PATH,
          `<strong>Private key dell'account:</strong> 0x${data.privateKey}`,
          "La chiave dell'account è derivata realmente lungo il percorso BIP-44, non copiata dalla master key."),
        formatStep("5. Public Key (secp256k1)", "64 byte (X || Y)", "0x" + data.publicKey.slice(4),
          "Chiave pubblica non compressa: le coordinate X e Y concatenate, senza il prefisso 04 per il calcolo dell'indirizzo Ethereum."),
        formatStep("6. Keccak-256 Digest", "256 bit / 32 byte", data.digest,
          "Keccak-256 applicato ai 64 byte della chiave pubblica non compressa."),
        formatStep("7. Ethereum Address (EIP-55)", "20 byte / 160 bit",
          `<strong style="color:var(--success)">${data.address}</strong>`,
          "Gli ultimi 20 byte del digest diventano l'indirizzo; la capitalizzazione EIP-55 aggiunge un checksum leggibile.", "highlight")
      ].join("");
    }

    function deriveData(phrase) {
      const { normalized, seed, wallet } = getWalletFromPhrase(phrase);
      const root = HDNodeWallet.fromSeed(getBytes(seed));
      const pubKey = wallet.signingKey.publicKey;
      const pubRaw = "0x" + pubKey.slice(4);
      const digest = keccak256(getBytes(pubRaw));
      const address = getAddress("0x" + digest.slice(-40));
      return {
        phrase: normalized,
        seed: seed.slice(2),
        masterPrivateKey: root.privateKey.slice(2),
        chainCode: root.chainCode.slice(2),
        privateKey: wallet.privateKey.slice(2),
        publicKey: pubKey.slice(2),
        digest,
        address,
        rawAddress: "0x" + digest.slice(-40),
        publicRaw: pubKey.slice(4)
      };
    }

    function runPipelineFromInput() {
      try {
        const phrase = document.getElementById("seedInput").value;
        const data = deriveData(phrase);
        renderPipelineUI(data);
        document.getElementById("avalancheLog").innerHTML = "";
      } catch (err) {
        alert("Mnemonic non valida o errore di derivazione. Usa una frase BIP-39 valida di 12, 15, 18, 21 o 24 parole. Dettaglio: " + err.message);
      }
    }

    function generateRandomSeed() {
      const wallet = HDNodeWallet.createRandom();
      document.getElementById("seedInput").value = wallet.mnemonic.phrase;
      runPipelineFromInput();
    }

    function countHammingDistance(hexA, hexB) {
      let a = BigInt("0x" + hexA.replace(/^0x/, ""));
      let b = BigInt("0x" + hexB.replace(/^0x/, ""));
      let diff = a ^ b, count = 0;
      while (diff > 0n) { count += Number(diff & 1n); diff >>= 1n; }
      return count;
    }

    function runAvalancheTest() {
      try {
        const data = deriveData(document.getElementById("seedInput").value);
        // FIX: Aggiunto "0x" per convertire correttamente l'esadecimale in BigInt
        const original = BigInt("0x" + data.privateKey);
        let flipped = original ^ 1n;
        if (flipped <= 0n || flipped >= SECP_N) flipped = original ^ 2n;
        const flippedHex = "0x" + flipped.toString(16).padStart(64, "0");
        const pubFlip = SigningKey.computePublicKey(flippedHex, false);
        const rawPubFlip = "0x" + pubFlip.slice(4);
        const digestFlip = keccak256(getBytes(rawPubFlip));
        const addrFlip = getAddress("0x" + digestFlip.slice(-40));
        const hamAddr = countHammingDistance(data.rawAddress, "0x" + digestFlip.slice(-40));
        const hamPub = countHammingDistance(data.publicRaw, pubFlip.slice(4));
        const pctAddr = (hamAddr / 160 * 100).toFixed(2);
        const pctPub = (hamPub / 512 * 100).toFixed(2);

        document.getElementById("statsGrid").style.display = "grid";
        document.getElementById("statSacAddr").innerText = pctAddr + "%";
        document.getElementById("barSacAddr").style.width = pctAddr + "%";
        document.getElementById("statHamAddr").innerText = `${hamAddr} / 160`;
        document.getElementById("statSacEc").innerText = pctPub + "%";
        document.getElementById("barSacEc").style.width = pctPub + "%";
        document.getElementById("avalancheLog").innerHTML = `<div class="step-box">
          <div class="step-header"><span class="step-title">Confronto singolo: k vs k ⊕ 1</span></div>
          <div class="step-val"><strong>Indirizzo originale:</strong> ${data.address}<br>
          <strong>Indirizzo modificato:</strong> ${addrFlip}<br>
          <strong>Bit cambiati nell'indirizzo:</strong> ${hamAddr}/160 (${pctAddr}%)<br>
          <strong>Bit cambiati nella chiave pubblica:</strong> ${hamPub}/512 (${pctPub}%)<br><br>
          Questo è un singolo esperimento illustrativo, non una dimostrazione dello Strict Avalanche Criterion. Per una valutazione statistica servono molti input e flip di bit indipendenti.</div>
        </div>`;
      } catch (err) {
        alert("Inserisci prima una mnemonic BIP-39 valida. " + err.message);
      }
    }

    // Esportazione su window per garantire il funzionamento degli onclick
    window.generateRandomSeed = generateRandomSeed;
    window.runPipelineFromInput = runPipelineFromInput;
    window.runAvalancheTest = runAvalancheTest;

    window.addEventListener("DOMContentLoaded", runPipelineFromInput);
  </script>
